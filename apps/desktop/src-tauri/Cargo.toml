[package]
name = "desktop"
version = "0.1.0"
description = "POS desktop app"
authors = ["POS"]
edition = "2024"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

pos-api = { path = "../../../crates/pos-api" }
pos-domain = { path = "../../../crates/pos-domain" }
pos-store = { path = "../../../crates/pos-store" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
