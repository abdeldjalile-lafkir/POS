name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust workspace tests + frontend typecheck/build (fast, no webview needed).
  test:
    name: Tests & lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Frontend deps
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Frontend build (typecheck + bundle)
        working-directory: apps/desktop
        run: bun run build

  # Windows installers (.msi via WiX and .exe via NSIS), attached to releases.
  windows:
    name: Windows installers
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Frontend deps
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build .msi and .exe
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --bundles msi,nsis

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pos-windows-installers
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
