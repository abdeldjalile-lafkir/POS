[workspace]
resolver = "2"
members = [
    "crates/pos-domain",
    "crates/pos-store",
    "crates/pos-printing",
    "crates/pos-api",
]
exclude = [
    "legacy",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["POS"]

[workspace.dependencies]
pos-domain = { path = "crates/pos-domain" }
pos-store = { path = "crates/pos-store" }
pos-printing = { path = "crates/pos-printing" }
pos-api = { path = "crates/pos-api" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
